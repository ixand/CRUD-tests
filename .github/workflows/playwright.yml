name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    env:
      GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
      GOOGLE_PASSWORD: ${{ secrets.GOOGLE_PASSWORD }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
       
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
       
      - name: Install dependencies
        run: npm ci
       
      # тести використовують лише chromium; повний --with-deps для всіх браузерів зависав на apt
      - name: Install Playwright Browsers
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Restore auth state
        env:
          PLAYWRIGHT_AUTH_STATE: ${{ secrets.PLAYWRIGHT_AUTH_STATE }}
        run: |
          mkdir -p playwright/.auth
          printf '%s' "$PLAYWRIGHT_AUTH_STATE" > playwright/.auth/user.json

      # лише chromium: проєкт auth логіниться паролем і в CI не запускається
      - name: Run Playwright tests
        timeout-minutes: 20
        run: npx playwright test --project=chromium
       
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 30